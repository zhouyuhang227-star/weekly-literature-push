name: weekly-literature-push

# 每周五 23:07（北京时间）自动运行 + 支持手动触发
#
# 多主题：src/config.py 里的 RESEARCH_TOPICS 有几个主题，就跑几个，
#         每个主题各自检索、各自打分、**各发一封邮件、各记各的已推送记录**。
#
# timezone 字段是 GitHub Actions 官方支持的写法（IANA 时区名），
# 因此无需再手工做 UTC 换算（若写成 UTC 则是 "7 15 * * 5"）。
#
# 为什么是 07 分而不是整点 00 分：GitHub 官方文档明确说明 schedule 事件
# 在 Actions 负载高峰时会被延迟，而"高峰期包括每个整点"，
# 故避开整点能显著降低延迟概率。改回整点只需把 cron 写成 "0 23 * * 5"。
#
# 下面三个 action 都用 v7：旧版（checkout@v4 / setup-python@v5 /
# upload-artifact@v4）内部声明的是 Node 20，而 Node 20 已于 2026-09-23
# 从 GitHub runner 上彻底移除，届时会直接报错。v7 系列声明的是 node24。
on:
  schedule:
    - cron: "7 23 * * 5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成邮件 HTML（存为 artifact），不发邮件、不改去重状态"
        type: boolean
        default: false
      lookback_days:
        description: "覆盖时间窗天数，留空则使用默认（首次 30 天 / 常规 14 天）"
        required: false
        type: string
      retrieval_mode:
        description: "第 1 层检索方式：keyword（字面短词，默认）/ topic（OpenAlex 语义主题，粒度粗）/ both（并集）"
        required: false
        type: choice
        default: keyword
        options:
          - keyword
          - topic
          - both
      topic:
        description: "只跑指定主题（留空 = 跑全部；多个用英文逗号分隔，写 name 或 key 均可）"
        required: false
        type: string

# 允许把更新后的 data/pushed_dois.json 提交回仓库
permissions:
  contents: write

# 防止两次运行并发导致 push 冲突
concurrency:
  group: weekly-literature-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          # OpenAlex 礼貌池（建议填你的邮箱）；不填也能跑，但速率更低
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          # OpenAlex API key（**可选**）。2026 年起 OpenAlex 按「额度/积分」计费，
          # 匿名请求约 100 次/天；一周跑一两次完全够用，只有反复调试才会打光，
          # 用完会返回 HTTP 429 + "Insufficient budget" 并要等次日 UTC 0 点恢复。
          # 想在 Actions 里也吃到独立额度，就把这个 secret 配上（不配=空=原来的行为）。
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # AI（任何 OpenAI 兼容端点，默认 DeepSeek）
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 邮件
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "${{ inputs.lookback_days }}" ]; then
            ARGS+=("--lookback-days" "${{ inputs.lookback_days }}")
          fi
          if [ -n "${{ inputs.retrieval_mode }}" ]; then
            ARGS+=("--retrieval-mode" "${{ inputs.retrieval_mode }}")
          fi
          if [ -n "${{ inputs.topic }}" ]; then
            IFS=',' read -ra PICKED <<< "${{ inputs.topic }}"
            for one in "${PICKED[@]}"; do
              one="$(echo "$one" | xargs)"      # 去掉前后空格
              if [ -n "$one" ]; then
                ARGS+=("--topic" "$one")
              fi
            done
          fi
          echo "运行参数：${ARGS[*]:-（无）}"
          python -m src.main -v "${ARGS[@]}"

      # 日志改走 artifact，避免每周 commit 导致仓库历史膨胀
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-logs-${{ github.run_number }}
          path: data/logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload dry-run email preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: email-preview-${{ github.run_number }}
          path: data/outbox/
          retention-days: 14
          if-no-files-found: ignore

      # 回写去重状态。
      #
      # 为什么是 always() 而不是 success()：多主题模式下每个主题各自发信、各自回写，
      # 其中一个主题失败时其余主题的邮件是**真的发出去了**，那些记录必须提交，
      # 否则下周会把同一批文献重复推给你。安全性由程序本身保证 ——
      # 状态文件里只会有「邮件确实发出」的记录（发信成功后才写盘），
      # 且发信前失败时文件无变化，下面的 git diff 守卫会直接跳过提交。
      - name: Commit pushed DOIs
        if: always() && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/pushed_dois.json
          if git diff --cached --quiet; then
            echo "去重状态无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: update pushed DOIs $(date +%F)"
          git push
